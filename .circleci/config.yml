version: 2.1
orbs:
  node: circleci/node@7.1.1

jobs:
  build:
    docker:
      - image: cimg/node:24.7.0
    steps:
      - checkout
      - run: sudo apt update && sudo apt install rsync
      - node/install-packages
      - run: npm run lint
      - run: npm run build:ci

workflows:
  build:
    jobs:
      - build
